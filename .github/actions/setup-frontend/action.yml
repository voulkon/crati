name: 'Setup Node + frontend deps'
description: 'Checkout-independent: Node 20, npm cache, npm ci, optional Playwright chromium'
inputs:
  install-playwright:
    description: 'Also install the Playwright chromium browser'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: frontend
    - if: inputs.install-playwright == 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
      working-directory: frontend
