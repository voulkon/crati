name: Build and Push Worker Base Image

# Trigger on changes to dependency files or manual dispatch
on:
  push:
    branches:
      - main
      - dev
      - preview
    paths:
      - 'backend/pyproject.toml'
      - 'backend/poetry.lock'
      - 'docker/Dockerfile.worker-base'
  workflow_dispatch:
    inputs:
      pytorch_version:
        description: 'PyTorch version (cpu for CPU-only, default for GPU support)'
        required: false
        default: 'cpu'
        type: choice
        options:
          - cpu
          - default

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/worker-base
  # Default to CPU builds on automated triggers to avoid disk space issues
  DEFAULT_PYTORCH: cpu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with branch name and pytorch variant
            type=raw,value={{branch}}-${{ inputs.pytorch_version || env.DEFAULT_PYTORCH }}
            # Tag with 'latest' on main branch (CPU by default for automated builds)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && (inputs.pytorch_version == 'cpu' || inputs.pytorch_version == '') }}
            # Tag with 'latest-gpu' on main branch for GPU builds
            type=raw,value=latest-gpu,enable=${{ github.ref == 'refs/heads/main' && inputs.pytorch_version == 'default' }}
            # Tag with 'preview' on preview branch (CPU by default for automated builds)
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/preview' && (inputs.pytorch_version == 'cpu' || inputs.pytorch_version == '') }}
            # Tag with 'preview-gpu' on preview branch for GPU builds
            type=raw,value=preview-gpu,enable=${{ github.ref == 'refs/heads/preview' && inputs.pytorch_version == 'default' }}
            # Tag with short commit SHA and variant
            type=sha,prefix={{branch}}-${{ inputs.pytorch_version || env.DEFAULT_PYTORCH }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTORCH_VERSION=${{ inputs.pytorch_version || env.DEFAULT_PYTORCH }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ inputs.pytorch_version || env.DEFAULT_PYTORCH }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ inputs.pytorch_version || env.DEFAULT_PYTORCH }},mode=max
          platforms: linux/amd64

      - name: Output image tags
        run: |
          echo "Image built and pushed with tags:"
          echo "${{ steps.meta.outputs.tags }}"
