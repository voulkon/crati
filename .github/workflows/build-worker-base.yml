name: Build and Push Worker Base Image

# Trigger on changes to dependency files or manual dispatch
on:
  push:
    branches:
      - main
      - dev
      - preview
    paths:
      - 'backend/pyproject.toml'
      - 'backend/poetry.lock'
      - 'docker/Dockerfile.worker-base'
  workflow_dispatch:
    inputs:
      pytorch_version:
        description: 'PyTorch version (cpu or default for GPU support)'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - cpu

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/worker-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with branch name and pytorch variant
            type=raw,value={{branch}}-${{ inputs.pytorch_version || 'default' }}
            # Tag with 'latest' on main branch (GPU-enabled by default)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && (inputs.pytorch_version == 'default' || inputs.pytorch_version == '') }}
            # Tag with 'latest-cpu' on main branch for CPU builds
            type=raw,value=latest-cpu,enable=${{ github.ref == 'refs/heads/main' && inputs.pytorch_version == 'cpu' }}
            # Tag with 'preview' on preview branch (GPU-enabled by default)
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/preview' && (inputs.pytorch_version == 'default' || inputs.pytorch_version == '') }}
            # Tag with 'preview-cpu' on preview branch for CPU builds
            type=raw,value=preview-cpu,enable=${{ github.ref == 'refs/heads/preview' && inputs.pytorch_version == 'cpu' }}
            # Tag with short commit SHA and variant
            type=sha,prefix={{branch}}-${{ inputs.pytorch_version || 'default' }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTORCH_VERSION=${{ inputs.pytorch_version || 'default' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ inputs.pytorch_version || 'default' }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ inputs.pytorch_version || 'default' }},mode=max
          platforms: linux/amd64

      - name: Output image tags
        run: |
          echo "Image built and pushed with tags:"
          echo "${{ steps.meta.outputs.tags }}"
