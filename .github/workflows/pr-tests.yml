name: PR Tests

on:
  pull_request:
    # Promotion path is dev -> preview -> main, so all three are valid targets.
    # `labeled` lets you opt an existing PR into the E2E suite by adding the
    # `run-e2e` label without pushing a new commit.
    branches: ["main", "dev"]
    types: [opened, synchronize, reopened, labeled]
  # main only: a push to dev is almost always the merge of an already-tested
  # PR, so re-running the full backend suite there is redundant.
  push:
    branches: ["main"]
  # Manual run (all E2E suites). The button only appears once this file is on
  # the default branch (main).
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history so dorny can resolve github.event.before on pushes.
          fetch-depth: 0

      - name: Check which paths changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # push        -> github.event.before (only the pushed commits)
          # pull_request -> the PR's base branch (e.g. dev/preview/main)
          # dispatch     -> main (fallback; the outputs are not used as a gate
          #                 on manual runs)
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.ref || 'main' }}
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/ci/**'
              - '.github/workflows/pr-tests.yml'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/pr-tests.yml'
              - '.github/actions/**'
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'scripts/ci/**'
              - 'docker/**'
              - 'Makefile'
              - '.github/workflows/pr-tests.yml'
              - '.github/actions/**'

  backend:
    name: Backend tests + coverage diff
    needs: changes
    # Skipped on a manual E2E run and when only a label changed (adding
    # `run-e2e` should not re-run the backend suite).
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.action != 'labeled' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_diavgeia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # diff-cover needs the base branch history to compute the diff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install

      - name: Run full test suite with coverage
        run: >
          poetry run pytest
          --cov=.
          --cov-report=xml:coverage.xml
          --cov-report=term-missing:skip-covered
          --cov-report=html:htmlcov
          --cov-branch
        env:
          DEBUG: 'False'
          SECRET_KEY: 'ci-secret-key'
          ALLOWED_HOSTS: '*'
          PG_TEST: 'True'
          TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/test_diavgeia'
          REDIS_HOST: 'localhost'
          REDIS_PORT: '6379'
          CELERY_BROKER_URL: 'amqp://guest:guest@localhost:5672//'

      - name: Coverage diff vs base branch
        run: ../scripts/ci/diff_cover.sh coverage.xml "origin/${{ github.base_ref || 'main' }}" 1

      - name: Report total coverage
        if: always()
        run: |
          poetry run python -c "
          import xml.etree.ElementTree as ET
          r = ET.parse('coverage.xml').getroot()
          attrs = r.attrib if r.tag == 'coverage' else r.find('coverage').attrib
          print(f'Total line coverage: {float(attrs[\"line-rate\"]) * 100:.1f}%')
          print(f'Total branch coverage: {float(attrs.get(\"branch-rate\", 0)) * 100:.1f}%')
          "

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/diff-cover.md
            backend/htmlcov/
          retention-days: 14

      - name: Comment coverage diff on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: backend-diff-cover
          path: backend/diff-cover.md

  frontend:
    name: Frontend tests
    needs: changes
    # See backend: skipped on manual E2E runs and label-only events.
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.action != 'labeled' &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false
        env:
          CI: 'true'

  # One job, one composite action (.github/actions/e2e-suite) per matrix
  # entry. To add a new E2E suite: add a matrix line, not a new job.
  # extra_env carries flags read by scripts/ci/create_env_file.sh to shape
  # the stack (e.g. ENABLE_THROTTLE_E2E=true) — see that script for options.
  e2e:
    name: E2E ${{ matrix.suite }} (non-blocking)
    needs: changes
    # Opt-in only: E2E boots the whole stack, so it no longer runs on every
    # backend/frontend/docker change. It runs when:
    #   * you add the `run-e2e` label to a PR, or
    #   * you trigger this workflow manually (workflow_dispatch), or
    #   * a push lands on main (post-merge safety net).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.e2e == 'true') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: ubuntu-latest
    # Task 05 gate decision: non-blocking for 2 weeks, then flip to blocking.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: auth
            spec: 'e2e/auth.spec.js e2e/clerk.spec.js'
            extra_env: ''
          - suite: throttling
            spec: 'e2e/free-access-throttling.spec.js'
            extra_env: 'ENABLE_THROTTLE_E2E=true'
          - suite: autoban
            # --grep scopes to suite C only: suite A's real browser navigation
            # (page.goto, no synthetic XFF) shares the low velocity threshold
            # and would self-ban the runner's own gateway IP otherwise.
            spec: "e2e/free-access-throttling.spec.js --grep 'suite C'"
            extra_env: 'ENABLE_AUTOBAN_E2E=true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run E2E suite
        uses: ./.github/actions/e2e-suite
        with:
          suite-name: ${{ matrix.suite }}
          spec: ${{ matrix.spec }}
          extra-env: ${{ matrix.extra_env }}
          # All optional — create_env_file.sh falls back to safe dummies.
          # Provide all three CLERK_* secrets to flip the auth stack to row A.
          gemi-api-key: ${{ secrets.GEMI_API_KEY }}
          clerk-publishable-key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}
          clerk-jwt-public-key: ${{ secrets.CLERK_JWT_PUBLIC_KEY }}

