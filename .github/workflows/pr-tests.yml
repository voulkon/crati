name: PR Tests

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    name: Backend tests + coverage diff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_diavgeia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # diff-cover needs the base branch history to compute the diff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install

      - name: Run full test suite with coverage
        run: >
          poetry run pytest
          --cov=.
          --cov-report=xml:coverage.xml
          --cov-report=term-missing:skip-covered
          --cov-report=html:htmlcov
          --cov-branch
        env:
          DEBUG: 'False'
          SECRET_KEY: 'ci-secret-key'
          ALLOWED_HOSTS: '*'
          PG_TEST: 'True'
          TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/test_diavgeia'
          REDIS_HOST: 'localhost'
          REDIS_PORT: '6379'
          CELERY_BROKER_URL: 'amqp://guest:guest@localhost:5672//'

      - name: Coverage diff vs base branch
        run: ../scripts/ci/diff_cover.sh coverage.xml "origin/${{ github.base_ref || 'main' }}" 1

      - name: Report total coverage
        if: always()
        run: |
          poetry run python -c "
          import xml.etree.ElementTree as ET
          r = ET.parse('coverage.xml').getroot()
          attrs = r.attrib if r.tag == 'coverage' else r.find('coverage').attrib
          print(f'Total line coverage: {float(attrs[\"line-rate\"]) * 100:.1f}%')
          print(f'Total branch coverage: {float(attrs.get(\"branch-rate\", 0)) * 100:.1f}%')
          "

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/diff-cover.md
            backend/htmlcov/
          retention-days: 14

      - name: Comment coverage diff on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: backend-diff-cover
          path: backend/diff-cover.md

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false
        env:
          CI: 'true'

  e2e-auth:
    name: E2E auth matrix (non-blocking)
    runs-on: ubuntu-latest
    # Task 05 gate decision: non-blocking for 2 weeks, then flip to blocking.
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend (with Playwright)
        uses: ./.github/actions/setup-frontend
        with:
          install-playwright: 'true'

      - name: Generate CI env file
        working-directory: .
        env:
          # All optional — create_env_file.sh falls back to safe dummies.
          # Provide all three CLERK_* secrets to flip the stack to row A.
          GEMI_API_KEY: ${{ secrets.GEMI_API_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_PUBLIC_KEY: ${{ secrets.CLERK_JWT_PUBLIC_KEY }}
        run: scripts/ci/create_env_file.sh .env_files/.env.ci

      - name: Boot stack (with DB, Django-only row B)
        working-directory: .
        run: make stack-up-ci ENV_FILE=.env_files/.env.ci

      - name: Run Playwright E2E
        working-directory: .
        run: make e2e
        env:
          E2E_BASE_URL: 'http://localhost'
          CI: 'true'

      # With DEBUG=False the full traceback of any unhandled 500 lands in the
      # backend container logs. Capture them BEFORE teardown destroys the stack.
      - name: Dump backend logs
        if: always()
        working-directory: .
        run: |
          set -x
          docker compose -f docker/docker-compose.yml -p diavgeia-ci --env-file=.env_files/.env.ci ps -a || true
          docker compose -f docker/docker-compose.yml -p diavgeia-ci --env-file=.env_files/.env.ci logs --no-color backend > backend-logs.txt 2> compose-logs-err.txt || true
          # Fallback: raw container logs (works even if compose metadata is
          # gone). Containers have no fixed names anymore, so resolve the
          # name via compose (project-prefixed) and fall back to grep.
          backend_cid=$(docker compose -f docker/docker-compose.yml -p diavgeia-ci --env-file=.env_files/.env.ci ps -q backend 2>/dev/null || true)
          [ -n "$backend_cid" ] && docker logs "$backend_cid" >> backend-logs.txt 2>&1 || true
          wc -c backend-logs.txt
          cat compose-logs-err.txt || true
          tail -c 100000 backend-logs.txt || true

      - name: Tear down stack
        if: always()
        working-directory: .
        run: make stack-down-ci ENV_FILE=.env_files/.env.ci || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            backend-logs.txt
            compose-logs-err.txt
          retention-days: 14
