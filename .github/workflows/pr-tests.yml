name: PR Tests

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + coverage diff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_diavgeia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # diff-cover needs the base branch history to compute the diff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install

      - name: Run full test suite with coverage
        run: >
          poetry run pytest
          --cov=.
          --cov-report=xml:coverage.xml
          --cov-report=term-missing:skip-covered
          --cov-branch
        env:
          DEBUG: 'False'
          SECRET_KEY: 'ci-secret-key'
          ALLOWED_HOSTS: '*'
          PG_TEST: 'True'
          TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/test_diavgeia'
          REDIS_HOST: 'localhost'
          REDIS_PORT: '6379'

      - name: Coverage diff vs base branch
        run: >
          poetry run diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref || 'main' }}
          --fail-under=80
          --markdown-report=diff-cover.md

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/diff-cover.md
          retention-days: 14

      - name: Comment coverage diff on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: backend-diff-cover
          path: backend/diff-cover.md

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false
        env:
          CI: 'true'
