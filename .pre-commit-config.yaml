# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # AI Slop Detection
  - repo: local
    hooks:
      - id: detect-ai-slop
        name: Detect AI Slop Patterns
        entry: python scripts/detect_ai_slop.py --ci --quiet
        language: system
        types: [python, javascript, markdown]
        files: '\.ts(x?)$'
        pass_filenames: false
        always_run: true

  # CSS Hard-coded Colors Detection
  - repo: local
    hooks:
      - id: detect-hardcoded-colors
        name: Detect Hard-coded Colors in CSS
        entry: python scripts/detect_hardcoded_colors.py frontend --ci --quiet
        language: system
        types: [css]
        pass_filenames: false
        always_run: true

  # Standard Python checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.13

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Remove unused imports and variables
  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --remove-duplicate-keys
          - --ignore-init-module-imports

  # Detect dead code (unused classes, methods, functions)
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        args: ['backend', '--min-confidence', '80']

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=150', '--extend-ignore=E203,W503,F541']

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ['-r', 'backend', '-ll']
        pass_filenames: false
