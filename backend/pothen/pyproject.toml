[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pothen-scraper"
version = "1.0.0"
description = "Python package for scraping and parsing Greek Parliament asset declarations (POTHEN system)"
authors = ["Konstantinos Voulgaropoulos <voulkon93@gmail.com>"]
readme = "README.md"
packages = [{include = "pothen", from = "src"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.28.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.3"
beautifulsoup4 = "^4.12.0"
lxml = "^4.9.0"
PyPDF2 = "^3.0.0"
pdfplumber = "^0.10.0"
urllib3 = "^2.0.0"
pathvalidate = "^3.2.0"
tqdm = "^4.66.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-mock = "^3.10.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"

[tool.poetry.group.test.dependencies]
responses = "^0.23.0"
vcrpy = "^4.2.0"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true