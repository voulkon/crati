{% extends "admin/change_list.html" %}
{% load i18n %}

{% block object-tools-items %}
  <li>
    <form action="{% url 'admin:afm_entity_stats_recompute' %}" method="post"
          style="display: inline;">
      {% csrf_token %}
      <button type="submit"
              style="background: var(--primary); color: white; padding: 8px 15px;
                     border: none; border-radius: 4px; font-weight: bold;
                     cursor: pointer;"
              onclick="return confirm('Recompute stats for ALL entities in the background?')">
        ⟳ Recompute All Stats
      </button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
