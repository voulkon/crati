version: '3.8'

# Production Database Service with TCP Gateway
# Deploy this on your Database Server

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: diavgeia_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ensure these scripts are available on the server at this path
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment: 
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Secure: Only expose to internal network, Nginx handles the rest
    expose:
      - "5432"
    networks:
      - diavgeia-db-prod-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # DB TCP Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: diavgeia_db_gateway
    restart: always
    volumes:
      # Mount the TCP Stream Config
      - ./nginx/db.nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "5432"
    networks:
      - diavgeia-db-prod-net
    depends_on:
      - db

volumes:
  postgres_data:
    driver: local

networks:
  diavgeia-db-prod-net:
    driver: bridge
    name: diavgeia-db-prod-net