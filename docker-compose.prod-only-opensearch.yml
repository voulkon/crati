version: '3.8'

# Production OpenSearch Service with HTTP Gateway
# Deploy this on your OpenSearch Server

services:
  opensearch:
    build: 
      context: docker/opensearch-custom
      dockerfile: Dockerfile
    container_name: diavgeia_opensearch
    restart: always
    environment:
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Ensure AWS secrets are passed here for backup plugins etc
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_S3_REGION_NAME:-eu-north-1}
    expose:
      - "9200"
      - "9600"
    networks:
      - diavgeia-os-prod-net
    volumes:
      - ./docker/opensearch-config:/usr/share/opensearch/config/custom
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Web Gateway for OpenSearch
  nginx:
    image: nginx:1.25-alpine
    container_name: diavgeia_os_gateway
    restart: always
    volumes:
      - ./nginx/opensearch.nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "9200"
    networks:
      - diavgeia-os-prod-net
    depends_on:
      - opensearch

  # Optional Dashboards (internal access only, or expose via another nginx block)
  opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: diavgeia_opensearch_dashboards
    restart: always
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    expose:
      - "5601"
    networks:
      - diavgeia-os-prod-net
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch_data:
    driver: local

networks:
  diavgeia-os-prod-net:
    driver: bridge
    name: diavgeia-os-prod-net