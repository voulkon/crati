services:

  # ───────────────────── Observability ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true         # enable modern OTLP receiver
    expose:
      - "16686"
      - "4317"  # OTLP gRPC
      - "4318"  # OTLP HTTP
    # ports:
    #   - "16686"
    networks: 
      - diavgeia-net

  loki:
    image: grafana/loki:latest
    container_name: diavgeia_loki
    expose:
      - "3100"
    networks:
      - diavgeia-net
    volumes:
      - loki_data:/loki
      - ./docker/loki-config:/etc/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:latest
    container_name: diavgeia_promtail
    volumes:
      - ./docker/promtail-config/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - diavgeia-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: diavgeia_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    expose:
      - "3000"
    networks:
      - diavgeia-net
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  db:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: diavgeia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment: 
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - diavgeia-net
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────── Broker ──────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: diavgeia_rabbitmq
    expose:
      - "5672"   # AMQP
      - "15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    networks:
      - diavgeia-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 15s
      retries: 5

  # ──────────────────────── Cache ─────────────────────────
  redis:
    image: redis:8.0.0-alpine
    container_name: diavgeia_redis
    command: sh -c "redis-server $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - diavgeia-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: diavgeia_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    expose:
      - "8081"
    networks:
      - diavgeia-net
    depends_on:
      - redis

  # ───────────────────────── Backend ─────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: diavgeia_backend
    volumes:
      - ./backend/api:/code/api
      - ./backend/core:/code/core
      - ./backend/diavgeia_project:/code/diavgeia_project
      - ./backend/docs:/code/docs
      - ./backend/sql_queries:/code/sql_queries
      - ./backend/templates:/code/templates
      - ./backend/users:/code/users
      - ./backend/version:/code/version
      - ./backend/manage.py:/code/manage.py
      - ./backend/pyproject.toml:/code/pyproject.toml
      - ./backend/poetry.lock:/code/poetry.lock
      - ./backend/Makefile:/code/Makefile
    expose:
      - "8000"
      - "8001"
    ports:
      - "8977:8001"
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - JAEGER_HOST=${JAEGER_HOST:-jaeger}
      - JAEGER_PORT=${JAEGER_PORT:-4317}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-1}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - GEMI_API_KEY=${GEMI_API_KEY}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - STEALTH_MODE=${STEALTH_MODE:-false}
      - STEALTH_ALLOWLIST=${STEALTH_ALLOWLIST:-false}
    networks:
      - diavgeia-net
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        # Control worker mode via environment variable
        # LIGHT_WORKER=true  → lightweight (no Docling, ~500MB, 2-3 min build)
        # LIGHT_WORKER=false → full mode (with Docling, ~13GB, 15+ min build)
        LIGHT_WORKER: ${LIGHT_WORKER:-false}
    container_name: diavgeia_worker
    command:  ["/bin/sh", "-c", "chmod +x /code/worker_entrypoint.sh && /code/worker_entrypoint.sh"]
    networks:
      - diavgeia-net
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - JAEGER_HOST=${JAEGER_HOST:-jaeger}
      - JAEGER_PORT=${JAEGER_PORT:-4317}
      - GEMI_API_KEY=${GEMI_API_KEY}
      - LIGHT_WORKER=${LIGHT_WORKER:-false}

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery-light
    container_name: diavgeia_beat
    command: celery -A diavgeia_project beat -l INFO
    networks:
      - diavgeia-net
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - GEMI_API_KEY=${GEMI_API_KEY}
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery-light
    container_name: diavgeia_flower
    command: celery -A diavgeia_project flower --port=5555 --basic-auth=${FLOWER_BASIC_AUTH}
    networks:
      - diavgeia-net
    expose:
      - "5555"
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH}

  # ───────────────────────── Front end ───────────────────────
  frontend:
    build: 
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
      args:
        REACT_APP_CLERK_PUBLISHABLE_KEY: ${REACT_APP_CLERK_PUBLISHABLE_KEY}
        REACT_APP_STEALTH_MODE: ${REACT_APP_STEALTH_MODE:-false}
        REACT_APP_STEALTH_ALLOWLIST: ${REACT_APP_STEALTH_ALLOWLIST:-false}
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    networks:
      - diavgeia-net

  # ──────────────────────── Gateway ──────────────────────────
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx    
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on: [backend, frontend, flower, jaeger]
    environment:
    - HOST=0.0.0.0
    - STAGING_MODE=${STAGING_MODE:-false}
    - STAGING_USERNAME=${STAGING_USERNAME:-}
    - STAGING_PASSWORD=${STAGING_PASSWORD:-}
    networks:
      - diavgeia-net

  opensearch:
    build: 
      context: docker/opensearch-custom
      dockerfile: Dockerfile
    container_name: diavgeia_opensearch
    environment:
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    expose:
      - "9200"
    networks:
      - diavgeia-net
    volumes:
      - ./docker/opensearch-config:/usr/share/opensearch/config/custom
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: diavgeia_opensearch_dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    expose:
      - "5601"
    networks:
      - diavgeia-net
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  opensearch_data:
    driver: local
    
networks:
  diavgeia-net:
    driver: bridge
