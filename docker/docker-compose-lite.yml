services:

  # ───────────────────── Observability ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true         # enable modern OTLP receiver
    # expose *one* port for the UI only
    ports:
      - "16686:16686"                       # http://<host>/jaeger (proxied)
      - "4317:4317"                         # OTLP gRPC port
      - "4318:4318"                         # OTLP HTTP port
    networks: 
      - diavgeia-net

  loki:
    image: grafana/loki:3.0.0
    container_name: diavgeia_loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki-config:/etc/loki/custom
    networks:
      - diavgeia-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: diavgeia_grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    networks:
      - diavgeia-net
    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Promtail for log collection
  promtail:
    image: grafana/promtail:3.0.0
    container_name: diavgeia_promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config:/etc/promtail
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - diavgeia-net
    depends_on:
      loki:
        condition: service_healthy
    labels:
      logging: "promtail"

  # ───────────────────────── Broker ──────────────────────────
  rabbitmq:
    # image: rabbitmq:4.01-management
    image: rabbitmq:3.12-management
    container_name: diavgeia_rabbitmq
    ports:
      - "5672:5672"  # AMQP protocol
      - "15672:15672"  # Management interface
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    networks:
      - diavgeia-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 15s
      retries: 5

  # ──────────────────────── Cache ─────────────────────────
  redis:
    image: redis:8.0.0-alpine
    container_name: diavgeia_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - diavgeia-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Add to docker-compose.yml
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: diavgeia_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - diavgeia-net
    depends_on:
      - redis

  # ───────────────────────── Backend ─────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: diavgeia_backend
    volumes:
      - ../backend:/code
    ports:
      - "8000:8000"
      - "${DJANGO_DEBUG_PORT:-8002}:${DJANGO_DEBUG_PORT:-8002}"
      - "8003:8003"
    env_file:
      - ../.env_files/.env.local.secrets
    environment:
      - DJANGO_DEBUG_PORT=${DJANGO_DEBUG_PORT:-8002}
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - JAEGER_HOST=${JAEGER_HOST:-jaeger}
      - JAEGER_PORT=${JAEGER_PORT:-4317}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - GEMI_API_KEY=${GEMI_API_KEY}
    networks:
      - diavgeia-net
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      logging: "promtail"
      service_name: "diavgeia-backend"
      component: "django"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: diavgeia_worker
    command: ["/code/worker_entrypoint.sh"]
    networks:
      - diavgeia-net
    volumes:
      - ../backend:/code
    ports:
      - "${CELERY_DEBUG_PORT:-8004}:${CELERY_DEBUG_PORT:-8004}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
      loki:
        condition: service_healthy
    env_file:
      - ../.env_files/.env.local.secrets
    environment:
      - CELERY_DEBUG_PORT=${CELERY_DEBUG_PORT:-8004}
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - JAEGER_HOST=${JAEGER_HOST:-jaeger}
      - JAEGER_PORT=${JAEGER_PORT:-4317}
      - GEMI_API_KEY=${GEMI_API_KEY}
    labels:
      logging: "promtail"
      service_name: "diavgeia-worker"
      component: "celery"

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery-light
    container_name: diavgeia_beat
    command: celery -A diavgeia_project beat -l INFO
    networks:
      - diavgeia-net
    volumes:
      - ../backend:/code
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
      loki:
        condition: service_healthy
    env_file:
      - ../.env_files/.env.local.secrets
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
    labels:
      logging: "promtail"
      service_name: "diavgeia-beat"
      component: "celery-beat"

  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery-light
    container_name: diavgeia_flower
    command: celery -A diavgeia_project flower --port=5555
    networks:
      - diavgeia-net
    ports:
      - "5555:5555"
    volumes:
      - ../backend:/code
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
      loki:
        condition: service_healthy
    env_file:
      - ../.env_files/.env.local.secrets
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
    labels:
      logging: "promtail"
      service_name: "diavgeia-flower"
      component: "celery-monitor"

  # ───────────────────────── Front end ───────────────────────
  frontend:
    build: 
      context: ..
      dockerfile: docker/Dockerfile.frontend
    networks:
      - diavgeia-net

  # ──────────────────────── Gateway ──────────────────────────
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    volumes:
      - ../nginx/local.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"                        # ← the single public port
    depends_on: [backend, frontend, flower, jaeger]
    environment:
    - HOST=0.0.0.0
    - STAGING_MODE=${STAGING_MODE:-false}
    - STAGING_USERNAME=${STAGING_USERNAME:-}
    - STAGING_PASSWORD=${STAGING_PASSWORD:-}
    networks:
      - diavgeia-net
  
  # Step 1a: Add OpenSearch
  opensearch:
    build: 
      context: ./opensearch-custom
      dockerfile: Dockerfile
    container_name: diavgeia_opensearch
    environment:
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-north-1}
    ports:
      - "9200:9200"
    networks:
      - diavgeia-net
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ./opensearch-config:/usr/share/opensearch/config/custom
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  opensearch_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
    
networks:
  diavgeia-net:
    driver: bridge
