version: '3.8'

# Standalone PostgreSQL database service with Nginx Gateway
# Usage: docker-compose -f docker/docker-compose-only-db.yml up -d

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: crati_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-scripts:/docker-entrypoint-initdb.d
    environment: 
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-crati}
    env_file:
      - ../.env_files/.env.local.secrets
    # No ports exposed to host, only to the internal network
    expose:
      - "5432"
    networks:
      - crati-db-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crati}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: crati_db_gateway
    volumes:
      - ../nginx/db.nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - crati-db-net
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
    
networks:
  crati-db-net:
    driver: bridge
    name: crati-db-net