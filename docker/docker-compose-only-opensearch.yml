version: '3.8'

# Standalone OpenSearch service with Nginx Gateway
# Usage: docker-compose -f docker/docker-compose-only-opensearch.yml up -d

services:
  opensearch:
    build: 
      context: opensearch-custom
      dockerfile: Dockerfile
    container_name: crati_opensearch
    environment:
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_S3_REGION_NAME:-eu-north-1}
    env_file:
      - ../.env_files/.env.local.secrets
    # No ports exposed to host, only to the internal network
    expose:
      - "9200"
      - "9600"
    networks:
      - crati-opensearch-net
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ./opensearch-config:/usr/share/opensearch/config/custom
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # OpenSearch Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: crati_opensearch_gateway
    volumes:
      - ../nginx/opensearch.nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    networks:
      - crati-opensearch-net
    depends_on:
      - opensearch
    restart: unless-stopped

  opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: crati_opensearch_dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://crati_opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    networks:
      - crati-opensearch-net
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opensearch_data:
    driver: local

networks:
  crati-opensearch-net:
    driver: bridge
    name: crati-opensearch-net