services:
  # Ultra-light Backend (only your application code)
  backend-aws:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: diavgeia_backend_aws
    volumes:
      - ../backend:/code
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8002:8002"
      - "127.0.0.1:8003:8003"
    env_file:
      - ../.env_files/.env.aws.secrets
    environment:
      - DEBUG=true
      - DJANGO_DEBUG_PORT=8002
      # These will be set in .env.aws.secrets from Terraform outputs
      # - DATABASE_URL=${AWS_DATABASE_URL}
      # - CELERY_BROKER_URL=${AWS_CELERY_BROKER_URL}
      # - REDIS_HOST=${AWS_REDIS_HOST}
      # - REDIS_PORT=${AWS_REDIS_PORT}
      # - OPENSEARCH_URL=${AWS_OPENSEARCH_URL}

  # Ultra-light Worker (only your worker code)
  worker-aws:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: diavgeia_worker_aws
    command: ["/code/worker_entrypoint.sh"]
    volumes:
      - ../backend:/code
    ports:
      - "127.0.0.1:8004:8004"
    env_file:
      - ../.env_files/.env.aws.secrets
    environment:
      - CELERY_DEBUG_PORT=8004
      # These will be set in .env.aws.secrets from Terraform outputs
      # - DATABASE_URL=${AWS_DATABASE_URL}
      # - CELERY_BROKER_URL=${AWS_CELERY_BROKER_URL}

  # Optional: Frontend (if you want to run it locally too)
  frontend-local:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: diavgeia_frontend_local
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend-aws

# No networks needed - everything connects over the internet to AWS
# No volumes needed - all data is in AWS
