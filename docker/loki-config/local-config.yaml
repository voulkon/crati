auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# ── Single-instance (monolithic) Loki 3.x ──
# Shared ring via common.ring — all components (ingester, distributor)
# must share the same ring in monolithic mode.
common:
  path_prefix: /loki
  ring:
    kvstore:
      store: inmemory
  replication_factor: 1
  instance_addr: 127.0.0.1

ingester:
  lifecycler:
    address: 127.0.0.1
  chunk_idle_period: 30m
  max_chunk_age: 1h

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  creation_grace_period: 6h
  max_entries_limit_per_query: 5000
  retention_period: 168h  # Keep logs for 7 days only

compactor:
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  compaction_interval: 10m
  delete_request_store: filesystem

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/usagestats/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false
