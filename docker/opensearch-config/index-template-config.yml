# OpenSearch Index Template Configuration
# This file configures the Greek documents index template
# Edit these settings as needed - they'll be applied when running:
# python manage.py setup_opensearch_greek

index_patterns:
  - "greek-*"
  - "diavgeia-*"

settings:
  number_of_shards: 1
  number_of_replicas: 0
  # Maximum number of results that can be returned in a single query
  # Default is 10,000. Increase if you need to retrieve more documents.
  # Be mindful of memory usage with very large values.
  index.max_result_window: 100000
  
  analysis:
    analyzer:
      greek_text_analyzer:
        type: custom
        tokenizer: standard
        filter:
          - icu_folding
          - lowercase
          - greek_stemmer
    
    filter:
      greek_stemmer:
        type: stemmer
        language: greek

mappings:
  properties:
    decision_id:
      type: integer
    ada:
      type: keyword
    title:
      type: text
      analyzer: greek_text_analyzer
    content:
      type: text
      analyzer: greek_text_analyzer
