server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Primary method: Docker socket (most reliable)
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    
    relabel_configs:
      # Set service name based on container name
      - source_labels: ['__meta_docker_container_name']
        target_label: 'service_name'
        regex: '/?(diavgeia_.*)'
        replacement: '${1}'
      
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container_name'
        regex: '/(.*)'
        replacement: '${1}'
      
      # Set component based on container name
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '.*(backend).*'
        replacement: 'django'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '.*(worker).*'
        replacement: 'celery'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '.*(beat).*'
        replacement: 'celery-beat'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '.*(flower).*'
        replacement: 'celery-monitor'
      
      # Set environment
      - target_label: 'environment'
        replacement: 'development'
    
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
