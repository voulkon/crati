# Redis persistence configuration for diavgeia project
# This ensures data survives container restarts

# Enable AOF (Append Only File) persistence - most durable option
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy: everysec is a good balance between performance and durability
# - always: very slow, very safe
# - everysec: fast enough, can lose 1 second of data
# - no: very fast, less safe
appendfsync everysec

# Enable RDB snapshots as backup (AOF is primary)
save 900 1      # save after 900 sec (15 min) if at least 1 key changed
save 300 10     # save after 300 sec (5 min) if at least 10 keys changed
save 60 10000   # save after 60 sec if at least 10000 keys changed

# RDB filename
dbfilename dump.rdb

# Directory for both RDB and AOF files
dir /data

# Log level
loglevel notice

# Disable protected mode for internal network
protected-mode no

# Memory management
maxmemory-policy noeviction
