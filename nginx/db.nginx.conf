user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    upstream db_server {
        server db:5432;
    }

    server {
        listen 5432;
        proxy_pass db_server;
        proxy_timeout 10m;
        proxy_connect_timeout 1s;
    }
}
