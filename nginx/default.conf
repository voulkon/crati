server {
    listen 80;
    client_max_body_size 100M;

    # Centralized X-Forwarded-Proto value.
    # Set to "https" when behind an SSL-terminating proxy (Cloudflare / Coolify).
    # Change to "$scheme" for direct HTTP access (local development).
    set $forwarded_proto "https";

    # Authentication is handled by Clerk at the application level
    # All routes are protected - users must sign in to access any content

    # NOTE: upstreams use the *-internal network aliases, which exist ONLY
    # on each stack's internal network. Plain service names (e.g. 'backend')
    # can also resolve via the shared 'coolify' network when nginx is
    # dual-homed, causing cross-environment round-robin. Never reintroduce
    # them here — see docs/postmortems/2026-08-28-pgbouncer-sasl-cross-env-dns-collision.md

    # Django API
    location /api/ {
        proxy_pass http://backend-internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Django Admin (useful for preview environment)
    location /admin/ {
        proxy_pass http://backend-internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    # Django Admin Static Files (must come before general /static/)
    location /static/admin/ {
        proxy_pass http://backend-internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin *;
    }

    # Django REST Framework Static Files
    location /static/rest_framework/ {
        proxy_pass http://backend-internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin *;
    }

    location /static/drf-yasg/ {
        proxy_pass http://backend-internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin *;
    }

    # Django Silk Static Files
    location /static/silk/ {
        proxy_pass http://backend-internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin *;
    }

    # React Static Files (everything else under /static/)
    location /static/ {
        proxy_pass http://frontend-internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Flower UI (useful for debugging)
    # location /flower/ {
    #     proxy_pass http://flower:5555/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $forwarded_proto;
    #     proxy_redirect off;
    # }

    # OpenSearch (useful for preview environment debugging)
    # location /opensearch/ {
    #     proxy_pass http://opensearch:9200/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $forwarded_proto;
    #     proxy_redirect off;
    # }

    # Jaeger UI
    # location /jaeger/ {
    #     proxy_pass http://jaeger:16686/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $forwarded_proto;
    #     proxy_set_header X-Forwarded-Prefix /jaeger;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_redirect ~^/(.*)$ /jaeger/$1;
    # }

    # React SPA - handles /, /manifest.json, and all other routes
    location / {
        proxy_pass http://frontend-internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
