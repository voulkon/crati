# Nginx Stream Configuration for Database Proxying
# This configuration MUST be included in the top-level 'stream {}' block, NOT in 'http {}'
# Standard Nginx Docker images (like 'nginx:alpine') include stream module by default
# but rely on /etc/nginx/nginx.conf to load stream configs.

# If we are replacing the MAIN nginx.conf, this file should look different.
# If we are dropping files into a structure, we need to know how the main config loads them.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

# 1. STREAM BLOCK - Handles TCP Traffic (PostgreSQL, OpenSearch)
stream {
    # ──────────────────────── PostgreSQL ────────────────────────
    upstream db_server {
        # Connect to the database container on its internal port
        server db:5432;
    }

    server {
        # Listen for TCP connections on external port 5432
        listen 5432;
        # Pass raw TCP traffic to the upstream
        proxy_pass db_server;

        # Optional: Proxy Timeout settings
        proxy_timeout 10m;
        proxy_connect_timeout 1s;
    }

    # ──────────────────────── OpenSearch (Optional TCP Stream) ────────────────────────
    # While OpenSearch is HTTP, streaming it via TCP (below) passes SSL through untouched.
    # If standard HTTP proxying (in the http block) is preferred for header modification, don't use this.
    # TCP Streaming is robust for "Just make it accessible" scenarios.

    # upstream opensearch_server {
    #     server opensearch:9200;
    # }

    # server {
    #     listen 9200;
    #     proxy_pass opensearch_server;
    # }
}


# 2. HTTP BLOCK - Handles Web Traffic (Frontend, Backend API)
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # Include the HTTP server blocks (Virtual Hosts)
    # This is where your existing 'local.nginx.conf' logic lives (location /api/, location /)
    include /etc/nginx/conf.d/*.conf;
}
